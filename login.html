<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    width: 100%;
    max-width: 340px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 8px; color: #1a1a1a; }
  p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
  button#googleBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    background: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    color: #3c4043;
    cursor: pointer;
    transition: box-shadow 0.2s, background 0.2s;
  }
  button#googleBtn:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.15); background: #f8f9fa; }
  button#googleBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg {
    margin-top: 20px;
    font-size: 0.88rem;
    min-height: 20px;
  }
  #msg.error { color: #d93025; }
  #msg.info { color: #666; }
</style>
</head>
<body>

<div class="card">
  <h1>Bienvenido</h1>
  <p class="subtitle">Inicia sesión con tu cuenta de Google para continuar</p>

  <button id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.89 2.69-6.64z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
      <path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.34z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
    </svg>
    Iniciar sesión con Google
  </button>

  <div id="msg"></div>
</div>

<!-- SDK de Firebase (versión compat, más simple de usar sin bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  const googleBtn = document.getElementById("googleBtn");
  const msg = document.getElementById("msg");

  function setMsg(text, type) {
    msg.textContent = text;
    msg.className = type || "";
  }

  // Si ya hay sesión activa, verificar y redirigir directamente
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      googleBtn.disabled = true;
      setMsg("Verificando acceso...", "info");
      const allowed = await isEmailAllowed(user.email);
      if (allowed) {
        window.location.href = "index.html";
      } else {
        setMsg("Tu cuenta (" + user.email + ") no tiene permiso para acceder.", "error");
        await auth.signOut();
        googleBtn.disabled = false;
      }
    }
  });

  googleBtn.addEventListener("click", async () => {
    setMsg("", "");
    googleBtn.disabled = true;
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const result = await auth.signInWithPopup(provider);
      const email = result.user.email;

      setMsg("Verificando acceso...", "info");
      const allowed = await isEmailAllowed(email);

      if (allowed) {
        window.location.href = "index.html";
      } else {
        setMsg("Tu cuenta (" + email + ") no está en la lista de accesos permitidos.", "error");
        await auth.signOut();
      }
    } catch (err) {
      console.error(err);
      setMsg("Error al iniciar sesión: " + err.message, "error");
    } finally {
      googleBtn.disabled = false;
    }
  });
</script>

</body>
</html>
